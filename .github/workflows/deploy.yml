name: Deploy Trip Diary to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 21 * * *" # 毎日06:00 JST（UTC 21:00）にNotionの最新内容を反映
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 那須旅行_202409/trip-diary
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: 那須旅行_202409/trip-diary/package-lock.json
      - run: npm ci
      - name: Fetch data & images from Notion
        run: npm run fetch-notion
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          NOTION_COMMENTS_DATABASE_ID: ${{ secrets.NOTION_COMMENTS_DATABASE_ID }}
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
      - name: Build static site
        run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: 那須旅行_202409/trip-diary/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
